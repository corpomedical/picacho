apply plugin: 'com.android.application'

// Upload-key signing (2026-08-20, first Play submission). The keystore and
// its password live OUTSIDE the repo: the .jks under ~/picacho-keys/ and the
// password in android/keystore.properties (gitignored). When the properties
// file is absent — CI, a fresh checkout, another machine — the release build
// still works, just unsigned, exactly as before.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "ai.picacho.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.picacho.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        // 12 = the camera plugin leaves the binary (2026-09-03, operator:
        // "Fix whatever is wrong without reducing functionality or damaging
        // the app", on Play's release-11 dashboard). Nothing in the web app
        // calls @capacitor/camera: both photo paths are <input type="file">
        // served by Capacitor core's file chooser. It was the only dependency
        // pulling Material Components and its resource tables, and it
        // declared three activities nothing could reach. Measured on the
        // signed artifact: AAB 4,535,254 -> 2,766,078 bytes (-39.0%), APK
        // 4,205,649 -> 2,278,072, DEX 4,787 -> 3,735 classes, manifest
        // activities 6 -> 3. Five of Play's eight deprecated edge-to-edge
        // call sites and its BitmapFactory warning were inside that stack.
        // THE REGRESSION CAUGHT BEFORE SHIPPING: the plugin's manifest was
        // the only source of the IMAGE_CAPTURE <queries> entry that core's
        // "Take photo" path needs on Android 11+; without it the button
        // silently opened the gallery. The three intents now live in our own
        // AndroidManifest.xml — verified on the emulator: capture tap opens
        // com.android.camera2 with the plugin gone. Excluded via
        // android.includePlugins, same as RevenueCat at 11; the npm package
        // stays. R8 optimization was measured (-1.4%, all plugins dispatch)
        // and deliberately NOT stacked here — one risk per versionCode.
        // 11 = the dormant store leaves the binary (2026-09-03). Measured
        // before deciding: @revenuecat/purchases-capacitor and the Amazon
        // Appstore SDK it pulls were 3,237 of 9,009 classes in the release
        // DEX — a third of the app — for a store that has never been able to
        // transact, because the UI gates on the plugin AND a RevenueCat key
        // that was never set. It also merged com.android.vending.BILLING
        // into a reader-mode app's manifest. Excluded via
        // android.includePlugins in capacitor.config.ts rather than an npm
        // uninstall: src/lib/native/purchases.ts imports the package with a
        // static specifier, so dropping the dependency would fail `next
        // build` and take down the site every binary loads. The server half
        // (the RevenueCat webhook, lib/play/products.ts, the SQL, the
        // runbook) is untouched and reactivation is three steps — see
        // PLAY_BILLING_SETUP.md. Measured after: 4,787 classes (down from
        // 9,009; zero com.revenuecat.*, zero com.amazon.*), APK 5,453,433 →
        // 4,205,649 bytes, AAB 6,601,430 → 4,535,254 bytes, and no BILLING
        // permission in the merged manifest. Bridge verified alive on the
        // Pixel_7 emulator: all nine plugins registered,
        // isPluginAvailable("Purchases") returns false without throwing.
        // 10 = BUILT AND SIGNED, NEVER UPLOADED — superseded by 11, which
        // removed the very plugin this entry was cut to add. Kept verbatim
        // as history; Play's live release is 9.
        // 10 = Play Billing returns (2026-09-02, operator: "we need to add
        // payment on the android app"): the RevenueCat Purchases plugin is
        // back in the binary — the deployed site's store UI self-gates on
        // Capacitor.isPluginAvailable("Purchases"), so THIS build lights up
        // Settings → usage with plans/packs while every older install keeps
        // the reader-mode surface its review approved. Nothing sells until
        // the PLAY_BILLING_SETUP.md runbook (products, service account,
        // RevenueCat, env vars, SQL) is completed.
        // 9 = the launcher icon's P scaled to the size it should always have
        // been (2026-08-30, operator: "the P stays Big in dark mode and normal
        // mode. I wanted the smaller P icon that was on dark mode"). Adaptive
        // icons show only the CENTRAL 72dp of the 108dp canvas — a built-in
        // 1.5x magnification — and this foreground was authored as if the whole
        // canvas were visible, so the glyph rendered at 61.5% of the visible
        // circle against the legacy raster's 40.6%. That mismatch WAS the
        // original bug: before 8, dark mode fell back to the legacy raster
        // (small P) while light mode used the adaptive icon (big P). Deleting
        // the night rasters in 8 made both big; this scales the artwork by
        // 0.661 so both are small, matching what he had in dark mode.
        // 8 = launcher-icon correctness (2026-08-29): adds the <monochrome>
        // layer the adaptive icon never had, so Android 13+ themed icons
        // render a silhouette WE control instead of leaving each launcher to
        // improvise from the colour layers (the improvisation differs between
        // launchers and, on some, between light and dark — the reported
        // "zoomed in and offset in normal mode"). Also deletes the five
        // mipmap-night-* directories, which held byte-identical copies of the
        // light rasters and only added ambiguity to icon resolution, and the
        // dead Android Studio template vector. Numbered 8 rather than 7
        // because 7 may already be uploaded; a skipped code is harmless, a
        // reused one is rejected.
        // 7 = the ANIMATED launch icon (2026-08-29, same day): versionCode 6
        // painted the splash field white but left windowSplashScreenAnimatedIcon
        // unset, so Android kept falling back to the static launcher icon and
        // the operator saw no change at all. The wordmark splash.png that 6
        // shipped was drawn under the system splash and never visible on any
        // supported API. 7 sets the attribute to a looping animation-list of
        // the P with its ochre rule wiping beneath it, per theme.
        // 6 = the branded-launch build (2026-08-29): splash drawable becomes
        // the wordmark-on-white brand field (night variant included, system
        // splash window painted to match), 8s native auto-hide backstop so
        // the splash can never hang, the offline fallback page that
        // dismisses the splash, and the Play in-app review plugin (fires
        // after a 4-5 star rating in the app's own feedback card).
        // 5 = unified /app/media library ships with it (web-side, but the
        // operator wanted a numbered build to test against), 2026-08-21.
        // Tracks CURRENT_VERSION in src/lib/changelog.ts. Bump versionCode
        // (never reuse a value) on every Play upload. 3 = launcher icon
        // committed to the dark tile in BOTH system themes (operator's call,
        // 2026-08-21: the ink tile reads better and never shifts size with
        // the theme), matching 512 store icon regenerated.
        versionName "1.12.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 on (2026-09-03, Play Console "App optimization is below our
            // threshold — Obfuscation (2%)", deadline Feb 2027): the release
            // DEX shipped fully unobfuscated because this was false, and Play
            // now treats any optimization category under 25% as something that
            // "may impact your visibility and publishing capabilities".
            //
            // Safe here because the reflection this app depends on is declared
            // by the libraries themselves: Capacitor resolves every plugin by
            // name from assets/capacitor.plugins.json via Class.forName
            // (PluginManager) and dispatches @PluginMethod by reflection, and
            // its AAR ships the consumer rules that keep exactly those
            // (-keep public class * extends com.getcapacitor.Plugin, plus the
            // annotation rules). Verified on the emulator against a signed
            // release build before this landed — see the smoke list in
            // MOBILE_APP.md.
            //
            // OPTIMIZATION ON (2026-09-04, Play Console release 12:
            // "Optimization isn't enabled"). The -optimize default file is not
            // a different ruleset — built both ways and diffed R8's own
            // emitted configuration.txt, the entire merged configuration for
            // this app differs by exactly two directives: -dontoptimize goes
            // out, -allowaccessmodification comes in. Every keep rule,
            // -keepattributes and -dontwarn from all 33 contributing files is
            // byte-identical, so none of the protection below depends on which
            // file is named. Note also that AGP 8.13's copy carries NO
            // -optimizations filter and NO -optimizationpasses; advice written
            // against older copies of this file describes something else.
            //
            // R8 full mode was already on (AGP's default since 8.0), so the
            // aggressive-interpretation behaviours people attribute to
            // "enabling optimization" were already in effect at versionCode 12.
            //
            // What this buys, measured on the artifact users download rather
            // than on the AAB: compressed classes.dex -25.7%, APK -11.55%. The
            // AAB itself moves only -1.9% because it carries the R8 mapping,
            // which GROWS — that is the wrong denominator to quote.
            //
            // shrinkResources stays OFF, and now with a measurement behind it
            // rather than caution: audited against the manifest, the themes,
            // the library code and the release DEX, exactly ONE app-owned
            // resource is referenced only dynamically (res/xml/config.xml, via
            // Cordova's getIdentifier at every launch), and the measured saving
            // did not justify a release of its own. Revisit with keep.xml if
            // the resource table ever grows.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
