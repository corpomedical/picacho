<!doctype html>
<!-- Offline / load-failure fallback for the native shells, loaded by
     Capacitor's server.errorPath (see capacitor.config.ts) when a main-frame
     load of picacho.ai fails. Inside the app this page lives at
     https://localhost/index.html — its own origin — so "Try again" must
     navigate BACK to the site: location.reload() here would only reload this
     error page itself, forever. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Picacho</title>
<style>
  html,body{height:100%;margin:0;font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#fff;color:#171717}
  @media (prefers-color-scheme:dark){html,body{background:#0a0a0a;color:#fafafa}}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px}
  h1{font-size:17px;font-weight:600;margin:0 0 6px}
  p{font-size:14px;opacity:.6;margin:0 0 24px;max-width:22em}
  button{font:inherit;font-size:15px;font-weight:500;color:#fff;background:#a84e24;border:0;border-radius:999px;padding:11px 24px}
  button:active{background:#8a3d18}
</style>
<main>
  <h1>Can't reach Picacho</h1>
  <p>Picacho needs the internet to generate. Your work in progress is saved and will be here when you're back.</p>
  <button onclick="location.href='https://picacho.ai/app'">Try again</button>
</main>
